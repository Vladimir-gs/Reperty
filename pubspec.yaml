name: reperty
description: Reperty — repertorio musical compartido para ministerios de alabanza y grupos musicales.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegación
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.5
  firebase_crashlytics: ^4.1.3
  google_sign_in: ^6.2.1

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
